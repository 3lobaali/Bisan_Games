<!DOCTYPE html>

.version-badge {

    font-weight: 900;
    letter-spacing: 1.5px;
    background: linear-gradient(135deg, #bdfaff, #00e5ff, #7dffbd) !important;
    border: 1px solid #ffffff;
    border-radius: 999px;
    box-shadow: 0 0 18px rgba(0, 229, 255, 0.62);
}

hr {
    width: min(650px, 86%);
    height: 2px;
    margin: 24px auto;
    border: 0;
    background: linear-gradient(
        90deg,

    font-size: 20px !important;
    font-weight: 800 !important;
